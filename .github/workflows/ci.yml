name: CI

on:
  push:
    branches: [main, finishing-touches, carer-caree, designupdates]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Extract release APK signing fingerprint
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          FINGERPRINT=$(keytool -printcert -jarfile "$APK" | grep "SHA256:" | awk '{print $2}')
          echo "APK_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "APK signing SHA-256: $FINGERPRINT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # Debug APK uses com.vialo.app.debug — installable alongside the
          # Play Store production build for side-by-side testing.
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Update latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Latest Vialo build from main.
            - app-release.apk  — production-style, com.vialo.app, shrunk + minified
            - app-debug.apk    — debug-signed, com.vialo.app.debug, installable
              alongside the Play Store build
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
